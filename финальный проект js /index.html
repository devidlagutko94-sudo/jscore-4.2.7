<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка промисов</title>
</head>
<body>
  <form>
    <label for="login-field">Логин</label>
    <input id="login-field" type="text">
    <p id="login-field-error"></p>

    <label for="password-field">Пароль</label>
    <input id="password-field" type="password">
    <p id="password-field-error"></p>

    <label for="email-field">Email</label>
    <input id="email-field" type="email">
    <p id="email-field-error"></p>
  </form>

  <form id="registration-form">
    <button type="button">Зарегистрироваться</button>
  </form>


  <script src="index.js"></script>
</body>
</html>
